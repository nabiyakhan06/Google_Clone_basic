<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Clone</title>
    <style>
        /* This centers everything on the screen */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* This centers the logo image and structure */
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* This makes the search bar round and styled */
        input[type="text"] {
            width: 580px;
            max-width: 90%;
            height: 44px;
            padding: 0 20px;
            margin-top: 20px;
            border: 1px solid #dfe1e5;
            border-radius: 24px; /* Makes the edges round */
            outline: none;
            font-size: 16px;
        }

        /* Adds space and aligns the buttons */
        .button-container {
            margin-top: 20px;
        }

        button {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            padding: 0 16px;
            height: 36px;
            margin: 0 4px;
            cursor: pointer;
        }
        
        button:hover {
            border: 1px solid #dadce0;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <!-- Replace the text with your actual <img> tag if you have a Google logo image -->
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google Logo" width="272" height="92">
        
        <input type="text" name="q">
        
        <div class="button-container">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>
    </div>

</body>
</html>
